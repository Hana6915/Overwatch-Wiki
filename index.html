<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overwatch Hero Database & Compare</title>
  <link rel="icon" type="image/png" href="image/round-overwatch-logo-symbol-701751694790776u0y9co1aam.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="logo">OVERWATCH <span>WIKI</span></div>
    <nav class="nav-tabs">
      <button class="nav-btn active" id="tabWiki">Trang Chủ</button>
      <button class="nav-btn" id="tabCompare">So Sánh Tướng</button>
    </nav>
  </header>

  <!-- VIEW 1: WIKI DATABASE -->
  <section id="wikiView" class="view-section active">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm tướng..." />
      <div class="filter-buttons">
        <button class="filter-btn active" data-role="All">Tất cả</button>
        <button class="filter-btn" data-role="Tank">Tank</button>
        <button class="filter-btn" data-role="Damage">Damage</button>
        <button class="filter-btn" data-role="Support">Support</button>
      </div>
    </div>
    <main class="container">
      <div class="hero-grid" id="heroGrid"></div>
    </main>
  </section>

  <!-- VIEW 2: COMPARE HEROES -->
  <section id="compareView" class="view-section">
    <div class="compare-container">
      <h2>SO SÁNH THÔNG SỐ ANH HÙNG</h2>
      <div class="compare-selectors">
        <select id="selectHero1" class="hero-select">
          <option value="">-- Chọn tướng thứ nhất --</option>
        </select>
        <span class="vs-badge">VS</span>
        <select id="selectHero2" class="hero-select">
          <option value="">-- Chọn tướng thứ hai --</option>
        </select>
      </div>
      <div class="compare-results" id="compareResults">
        <p class="placeholder-text">Vui lòng chọn 2 tướng ở trên để bắt đầu so sánh chỉ số.</p>
      </div>
    </div>
  </section>

  <!-- Hero Detail Modal -->
  <div class="modal-overlay" id="heroModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
